[project]
name = "latent-diffusion-experiments"
version = "0.1.0"
description = "Reproducible latent diffusion experiment environment for course report artifacts."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=0.25.0",
    "diffusers==0.30.3",
    "einops>=0.3.0",
    "numpy==1.26.4",
    "omegaconf>=2.1.1",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "safetensors>=0.4.0",
    "scipy>=1.11.0",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "tqdm>=4.66.0",
    "transformers==4.36.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
